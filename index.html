.bg-tint{background:linear-gradient(180deg,rgba(4,16,36,.62) 0%,rgba(4,16,36,.28) 30%,rgba(4,16,36,.08) 55%,rgba(4,16,36,.42) 100%)}
#snow{pointer-events:none}

/* ---------- Ram ---------- */
.app{position:relative;z-index:2;height:100vh;display:grid;grid-template-rows:auto 1fr;padding:2vh 3vw 3vh}

header{text-align:center}
.logo{height:4.4vh;filter:drop-shadow(0 .2vh 1vh rgba(0,20,50,.5));display:flex;justify-content:center;align-items:center;gap:.6vh}
.logo img{height:100%;width:auto}
.logo .wordmark{font-weight:700;font-size:3.6vh;letter-spacing:.01em}
h1{margin:.4vh 0 0;font-weight:900;font-size:min(7.6vh,5vw);line-height:1;letter-spacing:.02em;text-transform:uppercase;
  text-shadow:0 .3vh 2.4vh rgba(0,20,50,.55)}

.tabs{display:flex;justify-content:center;gap:1vh;margin-top:2.2vh}
.tab{backdrop-filter:blur(10px);font-weight:800;font-size:2.3vh;padding:1.1vh 2.4vh;border-radius:999px;background:var(--glass-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap;transition:background .4s,color .4s,box-shadow .4s}
.tab.active{background:linear-gradient(135deg,var(--ice),var(--ice-2));color:#04203F;border-color:transparent;box-shadow:0 0 2.4vh var(--glow)}
.segs{display:flex;justify-content:center;gap:1vh;margin-top:1.2vh}
.seg{width:9vh;height:.55vh;border-radius:9px;background:rgba(170,215,255,.22);overflow:hidden}
.seg i{display:block;height:100%;width:0;background:var(--ice);box-shadow:0 0 1vh var(--glow)}

.chips{display:flex;justify-content:center;gap:1.4vh;margin-top:2vh;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:1vh;font-weight:600;font-size:2.15vh;padding:1vh 2.2vh;border-radius:1.4vh;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(8px);white-space:nowrap}
.chip b{color:var(--ice);font-weight:800}
.chip svg{width:2.4vh;height:2.4vh;stroke:var(--ice);fill:none;stroke-width:2}

/* ---------- Innehåll ---------- */
.stage{display:grid;grid-template-columns:minmax(0,37%) minmax(0,1fr);gap:2.2vw;margin-top:2.6vh;min-height:0}
.fade{transition:opacity .5s ease}
.fade.out{opacity:0}

.left{display:flex;flex-direction:column;min-height:0}
.dept{margin:0;text-align:center;font-weight:900;font-size:min(6.4vh,4vw);line-height:1;letter-spacing:.02em;color:#fff;
  text-shadow:0 .3vh 2vh rgba(0,20,50,.6),0 0 4vh rgba(127,227,255,.5);white-space:nowrap}
.top3{display:flex;align-items:center;justify-content:center;gap:1vh;margin:1.4vh 0 1.2vh;font-weight:800;font-size:2.4vh;text-shadow:0 .2vh 1.2vh rgba(0,20,50,.6);letter-spacing:.06em;text-transform:uppercase}
.podium{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.12fr) minmax(0,1fr);gap:1vw;align-items:end;min-height:0}
.card{position:relative;background:var(--glass);border:1px solid var(--line);border-radius:2vh;backdrop-filter:blur(14px) saturate(1.2);
  padding:2.6vh .6vw 2.4vh;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-height:0}
.card.p1{height:78%;background:linear-gradient(180deg,rgba(20,60,120,.68),rgba(6,22,46,.62));box-shadow:0 0 4vh rgba(127,227,255,.18)}
.card.p2{height:68%} .card.p3{height:62%}
.medal{width:7.6vh;height:7.6vh;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:3.6vh;color:#0B1E36;flex:0 0 auto}
.p1 .medal{background:radial-gradient(circle at 35% 30%,#FFF1B0,var(--gold) 60%,#B88A12);box-shadow:0 0 3vh rgba(245,200,66,.6);width:9vh;height:9vh;font-size:4.4vh}
.p2 .medal{background:radial-gradient(circle at 35% 30%,#FFFFFF,var(--silver) 60%,#8D99A8);box-shadow:0 0 2.4vh rgba(201,211,222,.45)}
.p3 .medal{background:radial-gradient(circle at 35% 30%,#FFD2AE,var(--bronze) 60%,#94552A);box-shadow:0 0 2.4vh rgba(214,138,78,.45)}
.card .nm{margin-top:2vh;font-weight:800;font-size:min(2.8vh,1.35vw);line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.p1 .nm{font-size:min(3.2vh,1.55vw)}
.card .pt{margin-top:auto;padding-top:1.4vh;font-weight:900;font-size:min(3.4vh,1.55vw);color:var(--ice);font-variant-numeric:tabular-nums}
.p1 .pt{font-size:min(4vh,1.8vw)}
.card .pt small{display:block;font-size:1.7vh;font-weight:600;color:var(--muted);letter-spacing:.04em}

.right{padding:0;min-height:0;display:flex;flex-direction:column}
.list-head{display:flex;justify-content:space-between;align-items:center;color:#fff;font-weight:600;font-size:1.9vh;padding:0 0 1.2vh;text-shadow:0 .2vh 1vh rgba(0,20,50,.7)}
.list-head>span{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);padding:.7vh 1.6vh;border-radius:1vh}
.list-head b{color:var(--ice)}
#list{flex:1;min-height:0;display:grid;grid-auto-flow:column;column-gap:1.4vw;align-content:start}
.row{display:grid;grid-template-columns:2.4em minmax(0,1fr) auto;align-items:center;gap:.8vw;padding:0 .9vw;border-radius:1.2vh;position:relative;overflow:hidden;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px) saturate(1.2)}
.row .bar{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,rgba(62,155,255,.38),rgba(127,227,255,.12));z-index:0}
.row>span{position:relative;z-index:1}
.rk{font-weight:800;color:#C9DDF2;font-variant-numeric:tabular-nums}
.nmr{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptr{font-weight:800;color:var(--ice);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.empty{display:grid;place-items:center;height:100%;color:var(--muted);font-size:2.4vh;text-align:center}
@media (prefers-reduced-motion:reduce){.fade,.tab{backdrop-filter:blur(10px);transition:none}}
</style>
</head>
<body>
<div class="bg-photo" aria-hidden="true"></div>
<div class="bg-tint" aria-hidden="true"></div>
<canvas id="snow" aria-hidden="true"></canvas>

<div class="app">
  <header>
    <div class="logo"><img src="logo.png" alt="Innovative" onerror="this.remove();document.getElementById('wm').hidden=false"><span class="wordmark" id="wm" hidden>Innovative</span></div>
    <h1 id="title"></h1>
    <div class="tabs" id="tabs"></div>
    <div class="segs" id="segs"></div>
    <div class="chips">
      <div class="chip"><svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z M17 5h3v2a3 3 0 0 1-3 3 M7 5H4v2a3 3 0 0 0 3 3"/></svg>Totalt: <b id="c-total"></b> poäng</div>
      <div class="chip" id="chip-end"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Slutar: <b id="c-end"></b></div>
      <div class="chip"><b id="c-count"></b> deltagare</div>
      <div class="chip">Sida <b id="c-page"></b> / <span id="c-pages"></span></div>
    </div>
  </header>

  <section class="stage">
    <div class="left fade" id="left">
      <h2 class="dept" id="dept"></h2>
      <div class="top3"><span aria-hidden="true">🏅</span> Topp 3</div>
      <div class="podium" id="podium"></div>
    </div>
    <div class="right">
      <div class="list-head"><span id="lh-range"></span><span>Uppdaterad <b id="updated"></b></span></div>
      <div id="list" class="fade"></div>
    </div>
  </section>
</div>

<script>
/* ======= Data (genereras automatiskt) ======= */
const CONFIG = {"title": "Touchdown Sälen", "endsAt": "", "pageSeconds": 12, "reloadMinutes": 30, "updated": "5 okt 2026"};
const DEPTS  = [{"id": "tm_b2c", "label": "TM B2C", "rows": [["Nova Mccracken", 6225], ["Samir Fakhreddine", 5225], ["Ellen Norragård", 4700], ["Charlie Turesson", 4370], ["Wilmer Räni", 4100], ["Tristan Mackenzie", 4050], ["Dexter Command", 3875], ["Måns Aurelius", 3725], ["Osama Alweli", 3537.5], ["Alexia Soriano", 3506], ["Filip Tomic", 3376], ["Natalie Hayat", 3120], ["Edison Lilliér", 2906], ["Elvira Timmelstad", 2900], ["Isak Kriström", 2675], ["Robin Edman", 2544], ["Elias Fagerlund", 2450], ["Samira Taha", 2425], ["Walter Eklöf", 2390], ["Carl Sterner", 2300], ["André Walkenström", 2290], ["Andrea Lindefeldt", 2150], ["Simon Berhane", 2150], ["Alva Israelsson", 2090], ["Gustavo Chavez", 2000], ["Samuel Equbazghi", 1950], ["Oscar Skott", 1730], ["Filip Schröder", 1612.5], ["Elsa Mildh", 1570], ["Samuel Suliman", 1566], ["Saga Söderström", 1520], ["Noelia Alarcon", 1500], ["Edvin Husén", 1495], ["Theodor Eckstein", 1494], ["Jacob Brolin", 1450], ["Dylan Pesonen", 1350], ["Ebba Jarvin", 1350], ["Julian Dahlqvist", 1350], ["Ruben Malmborg", 1350], ["Selma Rosjö", 1350], ["Simon Wallin", 1350], ["Viggo Svanberg", 1350], ["Wille Ericsson", 1350], ["Charlie Crowe", 1345], ["Elias Widman", 1345], ["Philip Rydholm", 1205], ["Kaitlyn Reyes", 1150], ["Wilmer Grenås", 1150], ["Iris Valdemarsson", 1135], ["Lucas Nordgren", 1050], ["Nathalie Slivo", 1030], ["Wilhelm Folkesson", 852.5], ["Yonis Arale", 800], ["Bardia Batebi", 750], ["Bore Östman", 750], ["Folke Laulund", 750], ["Linus Andersson", 750], ["Stella Korsgren", 750], ["Theodor Yngström", 750], ["William Wreden", 750], ["Emelie Engström", 737.5], ["Fanny Berglund", 630], ["Jakob Kus", 630], ["Noah Bawil", 630], ["Felix Östholm", 625], ["Samuel Holmgren", 460], ["Josefine Ratcliffe", 436], ["Kid Hiltula", 400], ["Sara Agha", 160], ["Linus Breime", 140]]}, {"id": "tm_b2b_ga", "label": "TM B2B GA", "rows": [["Alexander Öberg", 17994.66], ["Noah Haavisto", 11877.3], ["Viktor Karlsson", 5829.18], ["Hugo Käld", 5704.92], ["Erik Schaffner", 5001.18], ["Lucas Börjesson Alsö", 4750.92], ["Emma Toding", 4273.92], ["Freddie Pedersson", 3984.18], ["Lukas Nordlöw", 3796.92], ["Mathias Arze", 3796.92], ["Gabriel Porseby", 3219.66], ["Olle Letterblad", 3219.66], ["Axel Olsten", 2852.46], ["Malin Friberg", 150]]}, {"id": "tm_b2b_pl", "label": "TM B2B PL", "rows": [["Adam Anberg Hanvik", 3655.9], ["Lily Karim", 3561.7], ["David Tillberg", 2962.86], ["Luka Brdaric", 2641.19], ["Viktor Karlsson", 2340.8], ["Lisa Hägg", 1586.43], ["Oliver Sjöström", 1334.74], ["Elton Adami", 750]]}, {"id": "fm", "label": "FM", "rows": [["Linus Nils Wikner", 6300], ["Lucas Falletta", 5040], ["Torkel Ekberg", 4380], ["Kristian Georgijevski", 4150], ["Valter Catoni", 3855], ["Carl Gergely", 3405], ["Adrian Jashari", 3350], ["Benjamin Akatugba", 3175], ["Carl-André Ahlman", 2950], ["Zion Ekelund", 2755], ["Moshin Miri", 2535], ["Axel Wallinder", 2510], ["Max Kinell", 2350], ["Robel Alemseghed", 1550], ["Sara Akgun", 1550], ["Liam Gustavsson", 1485], ["Jénovic Luyindula", 1430], ["Tuva Hulth", 1430], ["Johan Pavon", 1170], ["Adam Moujab", 1150], ["Maria-Dolores Strindvall", 1150], ["Tuvali Svensson", 1100], ["Xercses Pettersson", 1030], ["Daud Dinay Kerar", 750], ["Dion Mohammad", 750], ["Gabriel Barnjak", 750], ["Melos Buzolli", 750], ["Richie Hunjan", 750], ["Viola Hjortheimer", 750], ["Kevin Olivares", 160], ["Martin Rashou", 140]]}];
/* ============================================ */

const PAGE_MS = CONFIG.pageSeconds * 1000;
const $ = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString("sv-SE");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const loadedAt = Date.now();

// Placering med delade platser vid lika poäng
DEPTS.forEach(d => {
  let rank = 0, prev = null;
  d.rows = d.rows.map((r, i) => { if (r[1] !== prev) { rank = i + 1; prev = r[1]; } return { name: r[0], pts: r[1], rank }; });
  d.total = d.rows.reduce((s, r) => s + r.pts, 0);
});
const ACTIVE = DEPTS.filter(d => d.rows.length);
let di = 0, page = 0, pageStart = performance.now();

$("title").textContent = CONFIG.title;
document.title = CONFIG.title + " – Topplista";
$("updated").textContent = CONFIG.updated;
if (CONFIG.endsAt) $("c-end").textContent = CONFIG.endsAt; else $("chip-end").hidden = true;

function layout(){
  const box = $("list");
  const h = box.clientHeight, gap = innerHeight * 0.008;
  const per = Math.max(3, Math.floor((h + gap) / (innerHeight * 0.054 + gap)));
  return { per, cols: 2, size: per * 2, rowh: (h + gap) / per - gap, gap };
}
const restOf = d => d.rows.slice(3);
const pagesOf = d => Math.max(1, Math.ceil(restOf(d).length / layout().size));

function renderHeader(){
  const d = ACTIVE[di];
  $("tabs").innerHTML = DEPTS.map(x => `<span class="tab${x === d ? " active" : ""}">${esc(x.label)}</span>`).join("");
  $("segs").innerHTML = DEPTS.map(x => `<span class="seg"><i data-id="${x.id}"></i></span>`).join("");
  $("c-total").textContent = fmt(d.total);
  $("c-count").textContent = d.rows.length;
}

function renderLeft(){
  const d = ACTIVE[di];
  $("dept").textContent = d.label;
  const order = [1, 0, 2]; // 2 – 1 – 3
  $("podium").innerHTML = order.map(i => {
    const r = d.rows[i];
    if (!r) return `<div></div>`;
    return `<div class="card p${i+1}"><div class="medal">${r.rank}</div><div class="nm">${esc(r.name)}</div><div class="pt">${fmt(r.pts)}<small>poäng</small></div></div>`;
  }).join("");
}

function renderList(){
  const d = ACTIVE[di], L = layout(), rest = restOf(d);
  const pages = pagesOf(d);
  if (page >= pages) page = 0;
  $("c-page").textContent = page + 1; $("c-pages").textContent = pages;
  const box = $("list");
  if (!rest.length){
    box.innerHTML = `<div class="empty">Alla deltagare syns i topp 3.</div>`;
    $("lh-range").textContent = d.label; return;
  }
  const max = d.rows[0].pts || 1;
  const slice = rest.slice(page * L.size, (page + 1) * L.size);
  box.style.gridTemplateRows = `repeat(${L.per}, ${L.rowh}px)`;
  box.style.gridTemplateColumns = "repeat(2, minmax(0,1fr))";
  box.style.rowGap = L.gap + "px";
  const fs = Math.min(L.rowh * 0.4, innerWidth * 0.0125);
  box.innerHTML = slice.map(r => `<div class="row" style="font-size:${fs}px">
      <span class="bar" style="width:${Math.max(0, r.pts / max * 100)}%"></span>
      <span class="rk">${r.rank}</span><span class="nmr">${esc(r.name)}</span><span class="ptr">${fmt(r.pts)}</span></div>`).join("");
  const from = slice[0].rank, to = slice[slice.length - 1].rank;
  $("lh-range").innerHTML = `<b>${esc(d.label)}</b>: plats ${from}–${to} av ${d.rows.length}`;
}

function renderAll(){ renderHeader(); renderLeft(); renderList(); }

function tickProgress(now){
  const d = ACTIVE[di];
  const frac = Math.min(1, (now - pageStart) / PAGE_MS);
  const pages = pagesOf(d);
  document.querySelectorAll(".seg i").forEach(el => {
    const idx = ACTIVE.findIndex(x => x.id === el.dataset.id);
    el.style.width = idx < 0 ? "0" : idx < di ? "100%" : idx > di ? "0" : ((page + frac) / pages * 100) + "%";
  });
}

function next(){
  const d = ACTIVE[di];
  const changeDept = page + 1 >= pagesOf(d);
  // Ladda om sidan efter ett helt varv så TV:n hämtar nya siffror
  if (changeDept && di === ACTIVE.length - 1 && Date.now() - loadedAt > CONFIG.reloadMinutes * 60000){ location.reload(); return; }
  const targets = changeDept ? [$("left"), $("list")] : [$("list")];
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  targets.forEach(t => t.classList.add("out"));
  setTimeout(() => {
    if (changeDept){ di = (di + 1) % ACTIVE.length; page = 0; } else page++;
    renderAll();
    targets.forEach(t => t.classList.remove("out"));
    pageStart = performance.now();
  }, reduce ? 0 : 500);
}

function loop(now){
  if (ACTIVE.length){
    tickProgress(now);
    if (now - pageStart >= PAGE_MS){ pageStart = Infinity; next(); }
  }
  requestAnimationFrame(loop);
}

if (!ACTIVE.length){
  document.querySelector(".stage").innerHTML = `<div class="empty" style="grid-column:1/-1">Topplistan visas här så fort resultaten laddats upp.</div>`;
} else {
  renderAll();
  let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(renderList, 200); });
  requestAnimationFrame(loop);
}

// Göm muspekaren
let idle; addEventListener("mousemove", () => { document.body.classList.remove("idle"); clearTimeout(idle); idle = setTimeout(() => document.body.classList.add("idle"), 3000); });

// Snöfall
(function(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = $("snow"), ctx = c.getContext("2d"); let w, h, f = [];
  function size(){ const dpr = devicePixelRatio || 1; w = c.width = innerWidth * dpr; h = c.height = innerHeight * dpr;
    f = Array.from({ length: Math.round(innerWidth / 30) }, () => ({ x: Math.random() * w, y: Math.random() * h, r: (Math.random() * 1.8 + .5) * dpr, s: (Math.random() * .5 + .25) * dpr, d: Math.random() * 6 })); }
  size(); addEventListener("resize", size);
  (function t(){ ctx.clearRect(0, 0, w, h); ctx.fillStyle = "rgba(255,255,255,.75)";
    for (const p of f){ p.y += p.s; p.d += .01; p.x += Math.sin(p.d) * .3; if (p.y > h){ p.y = -4; p.x = Math.random() * w; }
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill(); }
    requestAnimationFrame(t); })();
})();
</script>
</body>
</html>
